# Forces a re-run of build.rs when the rust-cache holds a bundled catalog
# that is older than the upstream data it was built from.
#
# WP-1403 Windows CI incident (2026-11-23): the rust-cache restored a
# target/ whose OUT_DIR/models.json was baked from an older/different
# upstream tree, and cargo's rerun-if-changed (data-dir mtime) did not
# notice — the e2e then failed with "model openai/gpt-4 not in the
# registry" while the test-profile catalog (and the live data dir) were
# complete. If any upstream catalog file is newer than the newest baked
# catalog, drop the pi-rust build-script outputs so build.rs re-runs.
# Cold builds (no cached target/) are a no-op.
name: Re-bundle upstream catalog if stale
runs:
  using: composite
  steps:
    - name: Re-bundle upstream catalog if stale
      shell: bash
      run: |
        baked=$(ls -t target/debug/build/pi-rust-*/out/models.json target/release/build/pi-rust-*/out/models.json 2>/dev/null | head -1)
        if [ -z "$baked" ]; then
          echo "no cached bundled catalog — nothing to do"
        elif [ -n "$(find upstream/packages/ai/src/providers/data -name '*.json' -newer "$baked" 2>/dev/null | head -1)" ]; then
          echo "upstream catalog newer than the baked catalog — re-running build.rs"
          rm -rf target/debug/build/pi-rust-*/ target/release/build/pi-rust-*/
        else
          echo "baked catalog is current"
        fi
