# Shared upstream setup for all jobs that need the pinned upstream tree
# (test matrix, bench, release). WP-1010: extracted from ci.yml so the
# cache/verify/repair logic lives in one place (review advisories
# R2-001/R2-004: the test and bench jobs had diverged copies).
#
# Requires the caller's workflow env:
#   UPSTREAM_SHA: full pinned commit of earendil-works/pi
#
# The cache key is derived from that env (single source of the SHA —
# advisory R3-UPSTREAM-SHA).
name: Upstream pinned setup
inputs:
  os:
    description: Runner OS for the per-OS cache key
    required: true
runs:
  using: composite
  steps:
    - name: Upstream (pinned clone + npm install + build, cached)
      id: upstream
      uses: actions/cache@v6
      with:
        path: |
          upstream/node_modules
          upstream/packages
        key: upstream-${{ env.UPSTREAM_SHA }}-${{ inputs.os }}-v3

    - name: Fetch pinned upstream (cache miss)
      if: steps.upstream.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init upstream
        git -C upstream remote add origin https://github.com/earendil-works/pi.git
        git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
        git -C upstream checkout --detach FETCH_HEAD

    - name: Node setup
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Verify upstream (import oracle; install if absent or the cache damaged it)
      # Cache miss: the whole tree is absent (installs once below). Cache
      # hit: actions/cache does not round-trip npm workspace links
      # (junctions on Windows) deterministically — a restored tree can lose
      # a node_modules/<pkg> entry, leave it as an empty directory, or lose
      # files (ERR_MODULE_NOT_FOUND for @earendil-works/pi-ai, WP-1009 CI
      # rounds 1-5; a directory-level check missed the damage because the
      # surviving layers looked intact). Oracle: import the three dist entry
      # points the sidecar actually loads — side-effect free, and together
      # they exercise workspace resolution, dist contents and transitive
      # imports. Repair (source fetch + npm ci + build) only when one fails.
      working-directory: upstream
      shell: bash
      run: |
        if ! node --input-type=module -e "
          const here = process.cwd();
          for (const m of [
            'packages/coding-agent/dist/core/settings-defaults.js',
            'packages/coding-agent/dist/index.js',
            'packages/tui/dist/index.js',
          ]) {
            await import('file://' + here + '/' + m);
          }
          console.log('upstream entry points import ok');
        "; then
          echo "upstream tree absent or damaged — installing"
          if [ ! -f package.json ]; then
            # damaged-cache hit: only node_modules + packages/ were cached,
            # the source (root package.json, lockfile) was never fetched
            git init .
            git remote add origin https://github.com/earendil-works/pi.git
            git fetch --depth 1 origin "$UPSTREAM_SHA"
            git checkout -f --detach FETCH_HEAD
          fi
          npm ci
          npm run build
        fi

    - name: Verify upstream dist
      shell: bash
      run: test -f upstream/packages/coding-agent/dist/cli.js
