# M9/WP-903: release pipeline.
# Tag `v*` (staging tags like v0.0.0-staging.1 use the same path) ->
# GitHub release with per-architecture tarballs + generated changelog.
#
# Regime (repo setting "immutable release assets", permanently ON): GitHub
# stamps a release immutable AT CREATION TIME — an immutable release can
# NEVER receive an asset upload, and a tag ever used by an immutable
# release can never be reused. So this workflow is the ONLY place a
# release object is created: in one shot, with ALL its assets.
# release-please no longer creates tags/releases (skip-github-release: true
# in release-please.yml) — its cut-tag job pushes a real tag and then
# dispatches this workflow explicitly via the workflow_dispatch surface
# below (a tag pushed by the workflow's own token does NOT fire this
# `push: tags` event — self-trigger suppression, v1.3.0 incident). A
# human-cut tag pushed manually still triggers it via the push event.
#
# Manual fallback (workflow_dispatch, tag input): same publish path for a
# tag that did not trigger this workflow. Re-running is safe: a release
# that already has assets is re-uploaded; an asset-less release (impossible
# in this regime) is a hard error — delete the release object (the tag
# stays) and re-run.
#
# Package layout (the sidecar resolves ../upstream relative to itself):
#   pi-rust-<tag>/
#     pi-rust            (stripped release binary)
#     sidecar/           (the bridge + original loader wiring)
#     upstream/          (built pinned upstream tree, dev deps pruned)
#     providers/         (the four E4S2 provider plugins — Rust cdylibs,
#                          ABI v1: radius/github-copilot/xai/meta; the core
#                          loads them from <exe dir>/providers/ at startup,
#                          src/provider/plugin.rs) — ABSENT on the
#                          aarch64-unknown-linux-musl target: rustc cannot
#                          emit a cdylib for musl targets, and a static
#                          musl binary cannot dlopen at all (see D18,
#                          docs/decisions-open.md)
#
# WHY workflow_dispatch exists (v1.2.0 incident, 2026-11-25): release-please
# used to create its tags via the GitHub API (git.createRef), and GitHub
# does not fire push:tags events for API-created refs — so the tag-push
# trigger below never ran for v1.2.0 and the release shipped with 0 assets.
# Tags cannot be deleted (repo rule), so "delete + re-push" was off the
# table. That workaround is now structural: release-please.yml's cut-tag
# job pushes real tags, so normal releases fire this workflow
# automatically; the dispatch input remains the manual fallback (see
# header). Operating instruction for a manual run: pick the tag to
# build/publish in the Actions tab.
name: release

# gh release (the gh CLI ships on the runners) publishes the artifacts —
# no third-party release action (softprops/action-github-release vanished
# from GitHub; 404 at resolve time).
permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  # The dispatch surface is the PRIMARY trigger (release-please.yml's
  # cut-tag dispatches it explicitly after pushing the tag — self-trigger
  # suppression) and the manual fallback for a tag that did not fire the
  # push above.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish, e.g. v1.2.0"
        required: true
        type: string

env:
  UPSTREAM_SHA: "64a15f4bee63d761d5398bf4126ea63abef0dc98"
  CARGO_TERM_COLOR: always
  # The tag for this run: the dispatch input when present, else the pushed
  # tag. Steps and checkouts must use TAG, never GITHUB_REF_NAME — on
  # workflow_dispatch the event ref is the base branch, not the tag.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    # WP-1008: Windows steps are bash syntax on the runner's Git Bash
    # (pwsh is the default shell but cannot run these scripts).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-musl"]
          - os: macos-latest
            targets: ["aarch64-apple-darwin", "x86_64-apple-darwin"]
          # WP-1008: the msvc target is built natively on a Windows runner
          # (a GNU cross toolchain cannot produce msvc binaries).
          - os: windows-latest
            targets: ["x86_64-pc-windows-msvc"]
    runs-on: ${{ matrix.os }}
    # +10 min headroom over the pre-E4S2 budget: the provider plugins add
    # one more per-target aws-lc C compile (the plugins/ workspace build
    # below) on top of the core build.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }} # the tag to build (dispatch input or pushed tag)

      # The sidecar runs the ORIGINAL upstream loader: the package ships the
      # pinned, built upstream tree (dev deps pruned for size).
      - name: Fetch pinned upstream
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/earendil-works/pi.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Upstream npm install + build
        working-directory: upstream
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ join(matrix.targets, ' ') }}
      - uses: Swatinem/rust-cache@v2

      # musl cross: the TLS crate stack compiles C (cc-rs). Ubuntu 24.04 has
      # no musl-cross apt package (Debian only) — cross (docker) provides the
      # musl toolchain; pinned prebuilt CLI.
      - name: Install cross (musl target, linux job)
        if: runner.os == 'Linux'
        run: |
          curl -sSL --retry 3 https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz -o /tmp/cross.tar.gz
          tar xzf /tmp/cross.tar.gz -C /tmp
          install /tmp/cross /usr/local/bin/cross

      - name: Build release targets
        run: |
          for t in ${{ join(matrix.targets, ' ') }}; do
            if [ "$t" = "aarch64-unknown-linux-musl" ]; then
              cross build --release --target "$t"
            else
              cargo build --release --target "$t"
            fi
          done

      # E4S2: the four oauth builtins (radius, github-copilot, xai, meta)
      # are provider plugins — Rust cdylibs the core loads from
      # <exe dir>/providers/ at startup (src/provider/plugin.rs). They are
      # NOT compiled into the binary, so the release must build + ship
      # them. Same cross-compilation mechanism as the core above
      # (cargo build --release --target <t>). plugins/ is its own cargo
      # workspace: one invocation per target builds all four into the
      # shared plugins/target (one aws-lc C compile per target — the four
      # crates share the reqwest/tokio/aws-lc tree; the e2e's shared-target
      # pattern). The packaging step stages the cdylibs into
      # dist/<name>/providers/ with the loader's per-platform names.
      #
      # aarch64-unknown-linux-musl: SKIPPED — rustc cannot emit a cdylib
      # for musl targets (the target spec defaults to a static CRT and
      # disallows dylibs, invalid_output_for_target), and the static musl
      # core cannot dlopen anyway (musl: "Dynamic loading not supported")
      # — a bundled plugin could never load there. The musl artifact ships
      # without providers/ (a missing dir = "no plugins", the typed
      # "plugin not found" login path applies; D18 answered: (a) dynamic musl core + musl plugins — E4S4, until then this is the interim state).
      - name: Build provider plugins
        run: |
          cd plugins
          for t in ${{ join(matrix.targets, ' ') }}; do
            if [ "$t" = "aarch64-unknown-linux-musl" ]; then
              echo "skip provider plugins for $t (no cdylib on musl, no dlopen in the static core — D18)"
              continue
            fi
            cargo build --release --target "$t"
          done

      - name: Stage + package
        run: |
          tag="${TAG#v}"
          mkdir -p dist
          for t in ${{ join(matrix.targets, ' ') }}; do
            # WP-1008: the Windows artifact carries the .exe name (the four
            # POSIX targets keep the bare name in the published layout).
            exe="pi-rust"
            [ "$t" = "x86_64-pc-windows-msvc" ] && exe="pi-rust.exe"
            f="target/$t/release/$exe"
            file "$f" 2>/dev/null || true # diagnostic: what did the toolchain actually produce
            # best effort: a cross-produced binary the host strip cannot read
            # still ships (unstripped) — the smoke check below is the gate.
            strip "$f" || echo "WARN: strip failed for $t, packaging unstripped"
            name="pi-rust-${tag}-${t}"
            mkdir -p "dist/${name}"
            install -m 0755 "target/${t}/release/$exe" "dist/${name}/$exe"
            # E4S2: the four provider plugins (cdylibs, ABI v1). The loader
            # scans <exe dir>/providers/ for the platform ext (so/dylib/dll,
            # src/provider/plugin.rs); the provider name comes from the
            # vtable, not the file name. File name = cargo lib naming for
            # crate pi-provider-<p> (dashes -> underscores, lib prefix
            # unix-only) — the same convention the e2e's plugin_file_name
            # uses (tests/provider_oauth_plugins.rs). musl: no plugins
            # (D18 — no cdylib on musl, no dlopen in the static core).
            if [ "$t" != "aarch64-unknown-linux-musl" ]; then
              mkdir -p "dist/${name}/providers"
              case "$t" in
                *windows*) pre=""; ext="dll" ;;
                *darwin*) pre="lib"; ext="dylib" ;;
                *) pre="lib"; ext="so" ;;
              esac
              for p in radius github-copilot xai meta; do
                lib="${pre}pi_provider_${p//-/_}.${ext}"
                src="plugins/target/${t}/release/${lib}"
                [ -f "$src" ] || { echo "FATAL: missing provider plugin artifact ${src} (Build provider plugins step)"; exit 1; }
                # best effort, same as the core binary above.
                strip "$src" || echo "WARN: strip failed for ${lib}, packaging unstripped"
                install -m 0644 "$src" "dist/${name}/providers/${lib}"
              done
            fi
            cp -r sidecar "dist/${name}/sidecar"
            mkdir -p "dist/${name}/upstream"
            cp -r upstream/packages upstream/node_modules upstream/package.json "dist/${name}/upstream/"
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
            echo "${name}.tar.gz: $(du -h "dist/${name}.tar.gz" | cut -f1)"
          done

      # Acceptance: the release artifacts install and run (smoke scenario).
      # Cross targets run under qemu (linux) / Rosetta (macOS x86_64).
      - name: Smoke-check artifacts
        run: |
          tag="${TAG#v}"
          # check <dir> [runner...]: run the artifact's pi-rust (under an
          # optional qemu/Rosetta runner) and expect the fake echo.
          # The runner is a command prefix — never an argument to the binary.
          check() {
            dir="$1"; shift
            # WP-1008: the windows artifact ships pi-rust.exe.
            bin="$dir/pi-rust"
            [ -f "$dir/pi-rust.exe" ] && bin="$dir/pi-rust.exe"
            agent_dir="$(mktemp -d)"
            err="$(mktemp)"
            rc=0
            out="$("$@" "$bin" --provider fake --prompt hi --agent-dir "$agent_dir" 2>"$err")" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "smoke FAIL (exit $rc): $dir"
              head -10 "$err"
              return 1
            fi
            case "$out" in
              *"echo: hi"*) echo "smoke OK: $dir" ;;
              *) echo "smoke FAIL: $dir"; printf '%s\n' "$out" | head -5; head -10 "$err"; return 1 ;;
            esac
            # E4S2: the four bundled provider plugins must be discovered
            # from <exe dir>/providers/ (the load lines land on stderr in
            # headless mode, src/corelog.rs) — this is what makes the
            # bundled OAuth logins work in the installed artifact.
            # musl: no bundled plugins (D18) — WANT_PLUGINS=0 below.
            if [ "${WANT_PLUGINS:-1}" = "1" ]; then
              for p in radius github-copilot xai meta; do
                grep -q "provider plugin loaded: ${p} " "$err" || {
                  echo "smoke FAIL: provider plugin ${p} not discovered in $dir"; head -10 "$err"; return 1
                }
              done
            fi
          }
          for t in ${{ join(matrix.targets, ' ') }}; do
            name="pi-rust-${tag}-${t}"
            case "$t" in
              x86_64-unknown-linux-gnu) WANT_PLUGINS=1; check "dist/$name" ;;
              aarch64-unknown-linux-musl)
                # D18: no bundled plugins on musl (no dlopen in the
                # static core) — the smoke check asserts the run works
                # only.
                WANT_PLUGINS=0
                sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user >/dev/null
                check "dist/$name" qemu-aarch64 # static musl binary under qemu
                ;;
              aarch64-apple-darwin) WANT_PLUGINS=1; check "dist/$name" ;;
              x86_64-apple-darwin) WANT_PLUGINS=1; check "dist/$name" ;; # Rosetta on the arm64 runner
              x86_64-pc-windows-msvc) WANT_PLUGINS=1; check "dist/$name" ;; # native on the Windows runner
            esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/*.tar.gz

  publish:
    # One job publishes: the matrix jobs only build + smoke-check + upload,
    # so release creation cannot race (staging.4 died on a 422 immutable
    # upload when two matrix jobs published at once).
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }} # the tag to publish (dispatch input or pushed tag)
          fetch-depth: 0 # full history for the changelog (git describe --tags)
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-ubuntu-latest
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-macos-latest
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-windows-latest
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG}"
          prerelease=""
          case "$tag" in *staging*) prerelease="--prerelease";; esac
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          # A checked-in RELEASE_NOTES.md (written by the release WP) wins;
          # the commit list is the fallback.
          if git show "HEAD:RELEASE_NOTES.md" >/dev/null 2>&1; then
            notes="$(git show HEAD:RELEASE_NOTES.md)"
          elif [ -n "$prev" ]; then
            notes="$(git log --oneline "${prev}..HEAD" | sed 's/^/- /')"
          else
            notes="$(git log --oneline -25 | sed 's/^/- /')"
          fi
          # Immutability (repo setting "immutable release assets",
          # permanently ON): GitHub stamps a release immutable AT CREATION
          # TIME; an immutable release can NEVER receive an asset upload
          # (HTTP 422), and a tag ever used by an immutable release can
          # never be reused (HTTP 422 — verified on v1.2.1). Under this
          # regime the release object is created exactly ONCE, in one
          # shot, WITH its assets — so no delete/recreate dance exists
          # anymore (the #180 logic is obsolete: release-please no longer
          # creates asset-less releases, and creating one here is
          # impossible). Publish logic:
          #   release exists with assets (re-run)   -> (re)upload --clobber
          #   release missing (normal tag push)     -> create in one shot
          #                                            with all assets
          #   release exists without assets         -> impossible: fail
          #                                            loudly (an upload
          #                                            would 422, and the
          #                                            tag is now poisoned)
          assets_count="$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "$assets_count" -gt 0 ]; then
            # Re-run of a release that already has assets: just (re)upload.
            gh release upload "$tag" --clobber dist/*.tar.gz install.sh
          elif gh release view "$tag" >/dev/null 2>&1; then
            # An asset-less release exists. Under the permanent immutable-
            # releases setting it can never receive an upload, and its tag
            # can never be reused — there is no in-workflow recovery.
            echo "::error::Release $tag exists WITHOUT assets. Under the repo's permanent 'immutable release assets' setting an asset-less release can never receive an upload (HTTP 422) and the tag can never be reused. Delete the release object manually (the tag stays) and re-run this workflow." >&2
            exit 1
          else
            # Normal path: the release does not exist yet — create it in
            # one shot with all its assets.
            # --target is a full SHA (git rev-list -n1): --target with the
            # tag name itself 422s ("Release.target_commitish is invalid"),
            # and without --target the release points at the checkout
            # context (a moving branch), not the release commit.
            gh release create "$tag" --title "pi-rust ${tag}" \
              --target "$(git rev-list -n1 "$tag")" \
              --notes "$notes" $prerelease dist/*.tar.gz install.sh
          fi
