name: release-please

# Release automation (config in .github/release-please-config.json,
# versions in .release-please-manifest.json): a push to main with new
# commits beyond the latest tag opens/updates a release PR — bumps the
# root Cargo.toml version and rewrites the CHANGELOG.md section. The
# release PR gets the same manual review as every other PR.
#
# Regime (repo setting "immutable release assets", permanently ON): GitHub
# stamps a release immutable AT CREATION TIME — an immutable release can
# never receive an asset upload, and a tag ever used by an immutable
# release can never be reused. So the GitHub release must be created
# exactly once, in one shot, WITH its assets — by the tag-push workflow
# (release.yml), never by release-please. Hence:
#   - the action runs with skip-github-release: true → on release-PR merge
#     it creates NEITHER tag NOR release (release PRs still open/update);
#   - the cut-tag job below cuts the `vX.Y.Z` tag and pushes it, then
#     dispatches release.yml explicitly: a tag pushed by the workflow's
#     own token does NOT fire the `push: tags` event (GitHub suppresses
#     self-triggering — the v1.3.0 incident).
#
# Run gate: the action only runs when main has commits beyond the latest
# release tag — a push that lands nothing new since the tag skips it.
# (After cut-tag has tagged the release-PR merge, the NEXT push
# re-evaluates normally.)
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # gh workflow run (the cut-tag job dispatches release.yml — a tag pushed
  # by the workflow's own token does not fire push:tags, self-trigger
  # suppression).
  actions: write

jobs:
  # Cheap pre-flight: is there anything new to release?
  check-new-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: gate
        run: |
          last_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$last_tag" ] && [ "$(git describe --tags --exact-match HEAD 2>/dev/null || true)" = "$last_tag" ]; then
            echo "HEAD is on the latest tag ($last_tag) — nothing new to release, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "commits beyond ${last_tag:-<no tag>}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: check-new-commits
    if: needs.check-new-commits.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The googleapis action defaults to the repo root; this repo keeps
          # the config in .github/ (the former google-github-actions place).
          config-file: .github/release-please-config.json
          # Never create the tag/release (see header): release-please would
          # create the release asset-less, which under the permanent
          # "immutable release assets" setting can never receive the
          # assets — and would poison the tag forever. The action still
          # opens/updates the release PR (skipGitHubPullRequest is unset).
          # Verified in the action source: src/index.ts:141-144 —
          # manifest.createReleases() (tag + release) is only called when
          # this flag is false; the release-PR block (src/index.ts:147-150)
          # is gated separately.
          skip-github-release: true

  # Cuts the release tag that release-please no longer creates.
  # WHY (comment block, per the regime above):
  #  1. With skip-github-release: true, merging the release PR produces no
  #     tag from the action — the tag has to be cut by us.
  #  2. release.yml is dispatched explicitly after the push: a tag pushed
  #     by the workflow's own token does not fire the `push: tags` trigger
  #     (GitHub suppresses self-triggering — v1.3.0 shipped unreleased
  #     until a manual dispatch); API-created refs likewise do not fire
  #     it (v1.2.0 shipped with 0 assets exactly because of this).
  #  3. release.yml then builds the artifacts and creates the release in
  #     ONE shot with all assets — the only shape that works under the
  #     immutable-release-assets setting.
  # Idempotent: manifest version already tagged → no-op. Runs only when
  # the gate ran the action job above (skipped together otherwise).
  # Note: a tag push does NOT trigger ci.yml — its push trigger is
  # filtered to branches: [main] — so this tag is the only workflow
  # collateral of the merge push.
  cut-tag:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cut tag for the manifest version
        env:
          # For the `gh workflow run` below: the dispatch requires the
          # workflow token to carry `actions: write` (set in this file's
          # permissions block).
          GH_TOKEN: ${{ github.token }}
        run: |
          # The root (canonical) component lives under the key "." in the
          # manifest — verified against the checked-in file and against
          # .github/release-please-config.json ("packages": { ".": {} }).
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "ERROR: no version under key \".\" in .release-please-manifest.json — refusing to guess a tag" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "tag ${tag} already exists — nothing to cut"
          else
            git tag "${tag}" HEAD
            git push origin "${tag}"
            echo "cut + pushed ${tag} at $(git rev-parse HEAD)"
            # A tag pushed with the workflow's own token does NOT fire the
            # `push: tags` event (GitHub suppresses self-triggering), so
            # release.yml must be triggered explicitly via its
            # workflow_dispatch surface. Double-triggering is harmless by
            # design: publish is idempotent (an asset-bearing release gets
            # a clobber re-upload).
            # NOTE: dispatch runs ONLY in this new-tag branch — the
            # "already exists" path above skips it.
            gh workflow run release.yml --field "tag=${tag}"
          fi

          # release-please's createPullRequests() aborts while any MERGED
          # release PR still carries "autorelease: pending". Normally
          # createReleases() moves it to "autorelease: tagged" after
          # tagging — but with skip-github-release the action never does
          # that, so we must. (Verified in release-please 17.11.2,
          # manifest.js: findMergedReleasePullRequests + the abort
          # warning.) Title pattern from
          # .github/release-please-config.json:
          # "chore(release): ${version}". head -1: at most one merged
          # release PR is expected per version title; if one ever
          # duplicates, both get labeled across runs — idempotent.
          pr_number="$(gh pr list --state merged --label "autorelease: pending" \
            --json number,title --jq ".[] | select(.title == \"chore(release): ${version}\") | .number" | head -1)"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
            echo "labeled PR #${pr_number} as tagged"
          else
            echo "no pending release PR for ${version} — nothing to label"
          fi
