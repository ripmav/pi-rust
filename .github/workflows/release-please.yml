name: release-please

# Release automation (release-please 17, config in
# .github/release-please-config.json): every push to main with unreleased
# conventional commits opens/updates a release PR — bumps the root
# Cargo.toml version and rewrites the CHANGELOG.md section. Merging that
# PR cuts the `vX.Y.Z` tag and the GitHub release. The release PR gets
# the same manual review as every other PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The googleapis action defaults to the repo root; this repo keeps
          # the config in .github/ (the former google-github-actions place).
          config-file: .github/release-please-config.json
