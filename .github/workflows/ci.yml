# M9/WP-901: CI pipeline.
# Upstream is NOT tracked in this repo (`upstream/` is gitignored); the
# pinned commit is shallow-cloned here, then node_modules + built packages
# are cached so the build step only runs on a cache miss.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UPSTREAM_SHA: "085c84e98e7f4c950f2be606466fff4f75d8fe7c"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Upstream (pinned clone + npm install + build, cached)
        id: upstream
        uses: actions/cache@v4
        with:
          path: |
            upstream/node_modules
            upstream/packages
          key: upstream-085c84e9-${{ matrix.os }}-v1

      - name: Fetch pinned upstream (cache miss)
        if: steps.upstream.outputs.cache-hit != 'true'
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/earendil-works/pi.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Upstream npm install + build (cache miss)
        if: steps.upstream.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          npm ci
          npm run build

      - name: Verify upstream dist
        run: test -f upstream/packages/coding-agent/dist/cli.js

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Sidecar smoke
        run: node sidecar/smoke.mjs

  clippy:
    name: clippy
    # Hard gate from WP-902: the clippy baseline (0 warnings) landed here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # build.rs reads the upstream model catalog, which the upstream build
      # generates from TS source into packages/ai/src/providers/data.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Fetch pinned upstream (pinned source, built catalog)
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/earendil-works/pi.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
      - name: Upstream npm install + build
        working-directory: upstream
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  fmt:
    name: rustfmt
    # Hard gate from WP-902: the fmt baseline landed here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --check

  bench:
    name: bench (baseline compare)
    # WP-905: perf baseline — cold start to ready, idle RSS, bridge
    # throughput; fails on a per-metric band vs benches/baseline.json
    # (timing/throughput 20%, idle RSS 50% — RSS jitters ±1.5 MB across
    # shared runners, 20% was flaky).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Upstream (pinned clone + npm install + build, cached)
        id: upstream
        uses: actions/cache@v4
        with:
          path: |
            upstream/node_modules
            upstream/packages
          key: upstream-085c84e9-ubuntu-latest-v1
      - name: Fetch pinned upstream (cache miss)
        if: steps.upstream.outputs.cache-hit != 'true'
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/earendil-works/pi.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Upstream npm install + build (cache miss)
        if: steps.upstream.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Bench + compare against baseline
        run: |
          # Three samples, compared by per-metric median: single shared-runner
          # samples of the same code vary widely (observed throughput
          # 5780/6579/7621 events/s), so a one-sample gate is not stable.
          for i in 1 2 3; do
            set +e
            line="$(./target/release/pi-rust --bench --agent-dir "$(mktemp -d)" 2>>bench-stderr.log | grep '"cold_start_ms"')"
            set -e
            if [ -z "$line" ]; then
              echo "bench sample $i produced no usable output; stderr:"
              cat bench-stderr.log
              exit 1
            fi
            echo "$line" >> bench-samples.jsonl
          done
          python3 - <<'EOF'
          import json, statistics, sys
          samples = [json.loads(l) for l in open("bench-samples.jsonl") if l.strip()]
          base = json.load(open("benches/baseline.json"))
          # Per-metric band: idle RSS is noisy on shared runners (±1.5 MB
          # jitter) — a 50% band still catches real allocation regressions.
          BAND = {"idle_rss_mb": 0.5}
          def band(k): return BAND.get(k, 0.2)
          med = {k: statistics.median(s[k] for s in samples) for k in base}
          bad = []
          for k, v in base.items():
              g = med[k]
              ok = g >= v * (1 - band(k)) if k.endswith("_per_sec") else g <= v * (1 + band(k))
              if not ok:
                  bad.append(f"{k}={g:.1f} (baseline {v}, >{int(band(k) * 100)}% band)")
          print("median:", {k: round(v, 1) for k, v in med.items()})
          if bad:
              print("BENCH REGRESSION:")
              for b in bad:
                  print(" -", b)
              sys.exit(1)
          print("bench within band of baseline (median of 3 samples)")
          EOF

  fresh-clone:
    name: fresh-clone (README in a clean container)
    # WP-907 acceptance: a fresh-clone setup works by following the README
    # alone. Container job = clean OS (no preinstalled Rust, no caches);
    # the steps after the toolchain follow the README "From source" recipe
    # verbatim. The full suite is covered by the test jobs; here a smoke
    # subset (fake one-shot, sidecar smoke, CLI reference diff test).
    runs-on: ubuntu-latest
    container: node:26-bookworm
    timeout-minutes: 40
    steps:
      - name: Container deps
        run: apt-get update -qq && apt-get install -y -qq build-essential pkg-config python3 git
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build upstream (README "From source", step 1)
        run: |
          mkdir upstream && git -C upstream init
          git -C upstream remote add origin https://github.com/earendil-works/pi.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          cd upstream && npm ci --no-audit --no-fund && npm run build
      - name: Build + smoke (README "From source", step 2 + quickstart)
        run: |
          cargo build --release
          ./target/release/pi-rust --provider fake --prompt "hi"
          node sidecar/smoke.mjs
          cargo test --test cli_help
