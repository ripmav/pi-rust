[workspace]
resolver = "2"
members = ["pi-ext"]

[package]
name = "pi-rust"
version = "1.2.1"
edition = "2021"

[build-dependencies]
serde_json = "1"
sha2 = "0.11"   # input fingerprint for the CI stale-cache guard (catalog-verify); same crate as the main dependency

[dependencies]
chrono = "0.4"
sha2 = "0.11"
hmac = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }
futures-util = "0.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
libloading = "0.9"
