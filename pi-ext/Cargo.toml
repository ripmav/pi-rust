[package]
name = "pi-ext"
version = "1.3.2"
edition = "2021"
description = "Public Rust extension framework for pi (ADR 0001-0006)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The process runtime (WP-1205): stdio NDJSON dispatch, dialog/request
# round-trips with the capability timeout, provider streams.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-std", "io-util"] }
