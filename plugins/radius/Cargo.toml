# Radius provider plugin (E4S2/WP-1502): port of the upstream
# `radiusProvider` (pinned upstream 64a15f4) — wire API `pi-messages`
# (gateway /v1/messages) + the gateway device-code oauth flow
# (upstream `auth/oauth/radius.ts`). Member of the plugins/ workspace
# (plugins/Cargo.toml — the release pipeline builds all four per target
# in one invocation); built on demand by the e2e
# (tests/provider_oauth_plugins.rs), ships as a bundled plugin
# (<exe dir>/providers/).
[package]
name = "pi-provider-radius"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Excluded from the parent (pi-rust) workspace (own workspace root at
# plugins/, same isolation as the sample): the normal root
# build/test/clippy never compile it.

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Async client + rustls (the e2e mock is plain http; the real provider
# needs https) + form (the device-code/token endpoints are form-POST).
# Same versions as the sample.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }
futures-util = "0.3"
